---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  namespace: bridgex
  name: db-secret-vault
spec:
  provider: vault
  parameters:
    roleName: 'k8s'
    vaultAddress: 'https://192.168.1.150:8200'
    vaultSkipTLSVerify: "true"
    ## I have mounted this at the daemonSet of the vault CSI provided 
    vaultCACertPath: "/etc/vault-tls/ca.crt"
    objects: |
      - objectName: "DB-ROOT-PASSWORD"
        secretPath: "bridgex/data/db"
        secretKey: "MYSQL_ROOT_PASSWORD"
  secretObjects:
  - secretName: db-vault-synced-secret 
    type: Opaque
    data:
      - objectName: "DB-ROOT-PASSWORD" 
        key: "MYSQL_ROOT_PASSWORD"                
