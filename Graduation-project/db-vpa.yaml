apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: backend-db-vpa
  namespace: bridgex
spec:
  targetRef:
    apiVersion: "apps/v1"
    kind: StatefulSet
    name: backend-db
  updatePolicy:
    updateMode: "Recreate"
    minReplicas: 1
  resourcePolicy:
    containerPolicies:
    - containerName: "mysql"
      minAllowed:
        cpu: 100m
        memory: 128Mi
      maxAllowed:
        cpu: 2
        memory: 2Gi
      controlledResources:
      - cpu
      - memory
      controlledValues: RequestsAndLimits