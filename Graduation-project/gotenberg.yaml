apiVersion: apps/v1
kind: Deployment
metadata:
  creationTimestamp: null
  labels:
    app: gotenberg-backend
  name: gotenberg-backend
  namespace: bridgex
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gotenberg-backend
  strategy: 
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app: gotenberg-backend
    spec:
      containers:
      - image: gotenberg/gotenberg:8
        name: gotenberg
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3000
        resources: 
          requests:
            cpu: "0.2"
            memory: 100Mi