apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: frontend-deploy
  name: frontend-deploy
  namespace: bridgex
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend-deploy
  strategy: 
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 50%
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app: frontend-deploy
    spec:
      volumes:
        - name: nginx-conf
          configMap:
            name: frontend-cm
      containers:
      - image: bridgex/frontend:1.0
        name: frontend
        readinessProbe:
          httpGet:
            port: 80
            path: /
        imagePullPolicy: Always
        ports:
        - containerPort: 80
        envFrom:
          - configMapRef:
              name: frontend-cm
        volumeMounts:
          - mountPath: /etc/nginx/conf.d/default.conf
            name: nginx-conf
            subPath: nginx.conf
        resources: 
          requests:
            cpu: "0.1"
            memory: 50Mi
