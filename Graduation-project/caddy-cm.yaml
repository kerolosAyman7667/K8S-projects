apiVersion: v1
data:
  Caddyfile: |
    :80 {

      handle_path /app/docs {
        root * /srv/docs
        file_server
      }

      # Default: reverse proxy everything else to backend
      handle {
        reverse_proxy backend-svc.bridgex.svc.cluster.local:8000
      }
    }
kind: ConfigMap
metadata:
  name: caddy-cm
  namespace: bridgex