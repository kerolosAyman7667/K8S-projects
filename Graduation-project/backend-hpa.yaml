apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend-deploy-hpa
  namespace: bridgex
spec:
  minReplicas: 1
  maxReplicas: 10
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: backend-deploy
  behavior:
    ## this is important than my life cause the default window is 5 minute and my VMs were exploding
    scaleDown:
      stabilizationWindowSeconds: 10
      policies:
        - type: Percent
          value: 50      
          periodSeconds: 60
  metrics: 
  # - type: Resource
  #   resource:
  #     name: memory
  #     target:
  #       type: Utilization
  #       averageUtilization: 99
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 90